services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: locadora-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD em um arquivo .env local, veja .env.example}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - locadora-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  locadora-sqlserver-data:
