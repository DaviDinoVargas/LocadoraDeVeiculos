<app-auth-shell
  titulo="Gerencie sua locadora com simplicidade e controle total"
>
  <div class="auth-form-header">
    <h2>Entrar</h2>
    <p>Acesse sua conta para continuar.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="Ex: usuario@exemplo.com" required>
      <mat-error *ngIf="form.get('email')?.hasError('required')">Email é obrigatório</mat-error>
      <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Senha</mat-label>
      <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="senha" required>
      <button mat-icon-button matSuffix type="button" (click)="toggleShowPassword()" [attr.aria-label]="'Mostrar senha'" [attr.aria-pressed]="showPassword">
        <mat-icon>{{showPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('senha')?.hasError('required')">Senha é obrigatória</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="full-width login-btn">
      <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
      <span *ngIf="!loading">Entrar</span>
    </button>
  </form>

  <div class="auth-divider"><span>ou</span></div>

  <button mat-stroked-button type="button" class="full-width facial-toggle" (click)="alternarModoFacial()" [disabled]="loading">
    <mat-icon>face</mat-icon>
    {{ modoFacial ? 'Cancelar reconhecimento facial' : 'Entrar com reconhecimento facial' }}
  </button>

  <div class="facial-login" [class.hidden]="!modoFacial">
    <video #video muted playsinline [class.hidden]="!cameraAtiva"></video>
    <canvas #canvas class="hidden"></canvas>
    <p *ngIf="modoFacial && !cameraAtiva">Ligando câmera...</p>
    <button mat-raised-button color="accent" type="button" class="full-width" [disabled]="!cameraAtiva || loading" (click)="entrarComRosto()">
      <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
      <span *ngIf="!loading">Capturar e entrar</span>
    </button>
  </div>

  <p class="auth-footer-link">
    Não tem uma conta? <a routerLink="/registrar">Criar uma conta</a>
  </p>
</app-auth-shell>
