<app-auth-shell titulo="Gerencie sua locadora com simplicidade e controle total">
  <header class="mb-6">
    <h2 class="text-headline-s text-foreground">Entrar</h2>
    <p class="text-body-m text-muted-foreground mt-1">Acesse sua conta para continuar.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="entrar()" class="flex flex-col gap-4" novalidate>
    @if (erro()) {
      <div hlmAlert variant="destructive">
        <ng-icon name="lucideCircleAlert" aria-hidden="true" />
        <p hlmAlertDescription>{{ erro() }}</p>
      </div>
    }

    <app-form-field label="E-mail" required>
      <input hlmInput type="email" formControlName="email" autocomplete="email" placeholder="usuario@exemplo.com" />
    </app-form-field>

    <app-form-field label="Senha" required>
      <div class="relative">
        <input
          hlmInput
          [type]="mostrarSenha() ? 'text' : 'password'"
          formControlName="senha"
          autocomplete="current-password"
          class="pr-11"
        />
        <button
          type="button"
          hlmBtn
          variant="ghost"
          size="icon-sm"
          class="absolute top-1/2 right-1 -translate-y-1/2"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="mostrarSenha()"
          (click)="alternarSenha()"
        >
          <ng-icon [name]="mostrarSenha() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
        </button>
      </div>
    </app-form-field>

    @if (pedirCodigo()) {
      <app-form-field label="Código de verificação" hint="Seis dígitos do aplicativo autenticador, ou um código de recuperação.">
        <input hlmInput formControlName="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="000 000" />
      </app-form-field>
    }

    <button hlmBtn size="lg" type="submit" class="w-full" [disabled]="carregando()" [attr.aria-busy]="carregando()">
      @if (carregando() && !modoFacial()) {
        <ng-icon name="lucideLoader2" class="animate-spin motion-reduce:animate-none" aria-hidden="true" />
        Entrando…
      } @else {
        Entrar
      }
    </button>
  </form>

  <p class="text-body-m mt-3 text-center">
    <a routerLink="/esqueci-senha" class="text-primary font-medium underline-offset-4 hover:underline">Esqueci minha senha</a>
  </p>

  <div class="my-5 flex items-center gap-3" aria-hidden="true">
    <span class="bg-border h-px flex-1"></span>
    <span class="text-body-s text-muted-foreground">ou</span>
    <span class="bg-border h-px flex-1"></span>
  </div>

  <button hlmBtn variant="outline" size="lg" type="button" class="w-full" [disabled]="carregando()" (click)="alternarModoFacial()">
    <ng-icon name="lucideScanFace" aria-hidden="true" />
    {{ modoFacial() ? 'Cancelar reconhecimento facial' : 'Entrar com reconhecimento facial' }}
  </button>

  <div [class.hidden]="!modoFacial()" class="mt-4 flex flex-col gap-3">
    <div class="bg-video border-border relative aspect-[4/3] overflow-hidden rounded-xl border">
      <video #video muted playsinline class="size-full -scale-x-100 object-cover" [class.invisible]="!cameraAtiva()"></video>
      @if (!cameraAtiva()) {
        <p class="text-body-m text-on-video absolute inset-0 flex items-center justify-center" role="status">
          Ligando câmera…
        </p>
      }
    </div>
    <canvas #canvas class="hidden"></canvas>
    <button hlmBtn size="lg" type="button" class="w-full" [disabled]="!cameraAtiva() || carregando()" (click)="entrarComRosto()">
      @if (carregando()) {
        <ng-icon name="lucideLoader2" class="animate-spin motion-reduce:animate-none" aria-hidden="true" />
        Verificando…
      } @else {
        Capturar e entrar
      }
    </button>
  </div>

  <p class="text-body-m text-muted-foreground mt-6 text-center">
    Não tem uma conta?
    <a routerLink="/registrar" class="text-primary font-medium underline-offset-4 hover:underline">Criar uma conta</a>
  </p>
</app-auth-shell>
