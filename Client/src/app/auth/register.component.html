<app-auth-shell
  titulo="Comece a organizar sua locadora hoje mesmo"
  [destaques]="['Cadastro de veículos e clientes em minutos', 'Cupons e programas de fidelidade', 'Relatórios e recibos em PDF']"
>
  <header class="mb-6">
    <h2 class="text-headline-s text-foreground">Criar conta</h2>
    <p class="text-body-m text-muted-foreground mt-1">Preencha os dados para começar.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="registrar()" class="flex flex-col gap-4" novalidate>
    @if (erro()) {
      <div hlmAlert variant="destructive">
        <ng-icon name="lucideCircleAlert" aria-hidden="true" />
        <p hlmAlertDescription>{{ erro() }}</p>
      </div>
    }

    <app-form-field label="Nome completo" required>
      <input hlmInput formControlName="nomeCompleto" autocomplete="name" />
    </app-form-field>

    <app-form-field label="E-mail" required>
      <input hlmInput type="email" formControlName="email" autocomplete="email" />
    </app-form-field>

    <app-form-field label="Senha" required>
      <div class="relative">
        <input hlmInput [type]="mostrarSenha() ? 'text' : 'password'" formControlName="senha" autocomplete="new-password" class="pr-11" />
        <button
          type="button"
          hlmBtn
          variant="ghost"
          size="icon-sm"
          class="absolute top-1/2 right-1 -translate-y-1/2"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="mostrarSenha()"
          (click)="alternarSenha()"
        >
          <ng-icon [name]="mostrarSenha() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
        </button>
      </div>
    </app-form-field>

    <app-form-field label="Confirmar senha" required [mensagens]="mensagensConfirmacao">
      <div class="relative">
        <input
          hlmInput
          [type]="mostrarConfirmacao() ? 'text' : 'password'"
          formControlName="confirmarSenha"
          autocomplete="new-password"
          class="pr-11"
        />
        <button
          type="button"
          hlmBtn
          variant="ghost"
          size="icon-sm"
          class="absolute top-1/2 right-1 -translate-y-1/2"
          [attr.aria-label]="mostrarConfirmacao() ? 'Ocultar confirmação de senha' : 'Mostrar confirmação de senha'"
          [attr.aria-pressed]="mostrarConfirmacao()"
          (click)="alternarConfirmacao()"
        >
          <ng-icon [name]="mostrarConfirmacao() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
        </button>
      </div>
    </app-form-field>

    <button hlmBtn size="lg" type="submit" class="w-full" [disabled]="carregando()" [attr.aria-busy]="carregando()">
      @if (carregando()) {
        <ng-icon name="lucideLoader2" class="animate-spin motion-reduce:animate-none" aria-hidden="true" />
        Criando conta…
      } @else {
        Criar conta
      }
    </button>
  </form>

  <p class="text-body-m text-muted-foreground mt-6 text-center">
    Já tem uma conta?
    <a routerLink="/login" class="text-primary inline-flex items-center font-medium underline-offset-4 hover:underline pointer-coarse:min-h-12">Entrar</a>
  </p>
</app-auth-shell>
