<div *ngIf="show" class="logout-widget">
  <div class="user-chip">
    <span class="user-avatar">{{ iniciais }}</span>
    <span class="user-name">{{ usuarioNome }}</span>
  </div>
  <button mat-icon-button color="warn" (click)="sair()" class="logout-btn" title="Sair" aria-label="Sair">
    <mat-icon>logout</mat-icon>
  </button>
</div>
