<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar funcionário' : 'Novo funcionário'"
      descricao="Pessoa da equipe com acesso ao sistema."
      voltarPara="/funcionarios"
      rotuloVoltar="Funcionários"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados pessoais">
        <app-form-field class="col-span-12 sm:col-span-8" label="Nome completo" required>
          <input hlmInput formControlName="nomeCompleto" autocomplete="name" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="CPF" required [mensagens]="mensagensCpf">
          <input hlmInput formControlName="cpf" appMascara="cpf" placeholder="000.000.000-00" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="E-mail" hint="Usado para entrar no sistema.">
          <input hlmInput type="email" formControlName="email" autocomplete="email" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Contrato">
        <app-form-field class="col-span-12 sm:col-span-6" label="Salário" required [mensagens]="mensagensSalario">
          <div class="relative">
            <span class="text-muted-foreground pointer-events-none absolute top-1/2 left-3 -translate-y-1/2" aria-hidden="true">R$</span>
            <input hlmInput type="number" formControlName="salario" step="0.01" min="0" inputmode="decimal" class="pl-10" />
          </div>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Data de admissão" required>
          <input hlmInput type="date" formControlName="admissaoEmUtc" />
        </app-form-field>
      </app-form-section>

      <app-form-section
        [titulo]="editMode() ? 'Alterar senha' : 'Senha de acesso'"
        [descricao]="editMode() ? 'Opcional. Deixe em branco para manter a senha atual.' : 'Mínimo de 6 caracteres.'"
      >
        <app-form-field class="col-span-12 sm:col-span-6" [label]="editMode() ? 'Nova senha' : 'Senha'" [required]="!editMode()" [mensagens]="mensagensSenha">
          <div class="relative">
            <input hlmInput [type]="mostrarSenha() ? 'text' : 'password'" formControlName="senha" autocomplete="new-password" class="pr-11" />
            <button
              type="button"
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="absolute top-1/2 right-1 -translate-y-1/2"
              [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="mostrarSenha()"
              (click)="alternarSenha()"
            >
              <ng-icon [name]="mostrarSenha() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
            </button>
          </div>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" [label]="editMode() ? 'Confirmar nova senha' : 'Confirmar senha'" [required]="!editMode()" [mensagens]="mensagensConfirmacao">
          <div class="relative">
            <input hlmInput [type]="mostrarConfirmacao() ? 'text' : 'password'" formControlName="confirmarSenha" autocomplete="new-password" class="pr-11" />
            <button
              type="button"
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="absolute top-1/2 right-1 -translate-y-1/2"
              [attr.aria-label]="mostrarConfirmacao() ? 'Ocultar confirmação' : 'Mostrar confirmação'"
              [attr.aria-pressed]="mostrarConfirmacao()"
              (click)="alternarConfirmacao()"
            >
              <ng-icon [name]="mostrarConfirmacao() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
            </button>
          </div>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar funcionário'" (cancelar)="cancelar()" />
  </app-page>
</form>
