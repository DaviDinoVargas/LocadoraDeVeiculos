<app-page>
  <app-page-header titulo="Funcionários" descricao="Equipe com acesso ao sistema.">
    <a acoes hlmBtn routerLink="/funcionarios/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo funcionário
    </a>
  </app-page-header>

  <app-data-table
    tableId="funcionarios"
    itens="funcionários"
    item="funcionário"
    [colunas]="colunas"
    [dados]="funcionarios()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum funcionário cadastrado"
    descricaoVazio="Cadastre a equipe para que cada pessoa tenha o seu próprio acesso."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/funcionarios/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo funcionário
    </a>
  </app-data-table>
</app-page>
