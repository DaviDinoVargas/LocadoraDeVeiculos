<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="estreita">
    <app-page-header
      [titulo]="editMode() ? 'Editar parceiro' : 'Novo parceiro'"
      descricao="Empresa parceira que oferece benefícios aos clientes da locadora."
      voltarPara="/parceiros"
      rotuloVoltar="Parceiros"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados do parceiro">
        <app-form-field class="col-span-12" label="Nome" required>
          <input hlmInput formControlName="nome" autocomplete="organization" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="CNPJ" required [mensagens]="mensagensCnpj">
          <input hlmInput formControlName="cnpj" appMascara="cnpj" placeholder="00.000.000/0000-00" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Categoria" required>
          <hlm-native-select class="w-full" formControlName="categoria">
            <option hlmNativeSelectOption value="">Selecione a categoria</option>
            @for (c of categorias; track c.value) {
              <option hlmNativeSelectOption [value]="c.value">{{ c.label }}</option>
            }
          </hlm-native-select>
        </app-form-field>
        @if (editMode()) {
          <div class="col-span-12 flex items-center gap-3">
            <hlm-checkbox inputId="parceiro-ativo" formControlName="ativo" />
            <label hlmLabel for="parceiro-ativo">Parceiro ativo</label>
          </div>
        }
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar parceiro'" (cancelar)="cancelar()" />
  </app-page>
</form>
