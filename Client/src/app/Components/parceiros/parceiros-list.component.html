<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Parceiros</h3>
    <button class="btn btn-primary" (click)="novo()">
      <i class="bi bi-plus-circle me-1"></i>
      Novo Parceiro
    </button>
  </div>

  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
    <p class="mt-2">Carregando parceiros...</p>
  </div>

  <div *ngIf="!loading && parceiros.length > 0" class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Nome</th>
          <th>CNPJ</th>
          <th>Categoria</th>
          <th>Status</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of parceiros">
          <td>{{ p.nome }}</td>
          <td>{{ p.cnpj }}</td>
          <td>{{ categoriaLabel(p.categoria) }}</td>
          <td>
            <span class="badge" [ngClass]="p.ativo ? 'bg-success' : 'bg-secondary'">
              {{ p.ativo ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="text-end">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-primary" (click)="editar(p.id)" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger" (click)="excluir(p.id)" title="Excluir">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && parceiros.length === 0" class="alert alert-info">
    <i class="bi bi-info-circle me-2"></i>
    Nenhum parceiro cadastrado. Clique em "Novo Parceiro" para adicionar.
  </div>
</div>
