<app-page>
  <app-page-header titulo="Parceiros" descricao="Postos, hotéis, seguradoras e outros parceiros que oferecem benefícios aos clientes.">
    <a acoes hlmBtn routerLink="/parceiros/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo parceiro
    </a>
  </app-page-header>

  <app-data-table
    tableId="parceiros"
    itens="parceiros"
    item="parceiro"
    [colunas]="colunas"
    [dados]="parceiros()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum parceiro cadastrado"
    descricaoVazio="Cadastre parceiros para vincular cupons e desafios a eles."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/parceiros/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo parceiro
    </a>
  </app-data-table>
</app-page>
