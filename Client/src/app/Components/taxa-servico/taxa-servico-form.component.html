<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="estreita">
    <app-page-header
      [titulo]="editMode() ? 'Editar taxa ou serviço' : 'Nova taxa ou serviço'"
      descricao="Item adicional que pode ser somado ao valor do aluguel."
      voltarPara="/taxas-servicos"
      rotuloVoltar="Taxas e serviços"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados da taxa ou serviço">
        <app-form-field class="col-span-12" label="Nome" required>
          <input hlmInput formControlName="nome" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Preço" required [mensagens]="mensagensPreco">
          <div class="relative">
            <span class="text-muted-foreground pointer-events-none absolute top-1/2 left-3 -translate-y-1/2" aria-hidden="true">R$</span>
            <input hlmInput type="number" formControlName="preco" step="0.01" min="0" inputmode="decimal" class="pl-10" />
          </div>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Tipo de cálculo" required hint="Fixo cobra uma vez; diário multiplica pelos dias do aluguel.">
          <hlm-native-select class="w-full" formControlName="tipoCalculo">
            <option hlmNativeSelectOption value="">Selecione o tipo de cálculo</option>
            <option hlmNativeSelectOption value="Fixo">Fixo</option>
            <option hlmNativeSelectOption value="Diario">Diário</option>
          </hlm-native-select>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar'" (cancelar)="cancelar()" />
  </app-page>
</form>
