<app-page>
  <app-page-header titulo="Taxas e serviços" descricao="Itens adicionais cobrados no aluguel, como seguro, limpeza ou cadeirinha.">
    @if (podeEditar) {
      <a acoes hlmBtn routerLink="/taxas-servicos/new">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Nova taxa ou serviço
      </a>
    }
  </app-page-header>

  <app-data-table
    tableId="taxas-servicos"
    itens="taxas e serviços"
    item="taxa"
    [colunas]="colunas"
    [dados]="taxas()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhuma taxa ou serviço cadastrado"
    [descricaoVazio]="podeEditar ? 'Cadastre os itens extras que podem ser somados ao valor do aluguel.' : 'Peça a um administrador para cadastrar as taxas e serviços.'"
    (recarregar)="carregar()"
  >
    <label filtros class="flex items-center gap-2">
      <span class="text-label-l text-muted-foreground">Tipo</span>
      <hlm-native-select size="sm" aria-label="Filtrar por tipo de cálculo" (valueChange)="filtrarPorTipo($event ?? '')">
        <option hlmNativeSelectOption value="">Todos os tipos</option>
        <option hlmNativeSelectOption value="Fixo">Fixo</option>
        <option hlmNativeSelectOption value="Diario">Diário</option>
      </hlm-native-select>
    </label>
    @if (podeEditar) {
      <a acaoVazia hlmBtn routerLink="/taxas-servicos/new">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Nova taxa ou serviço
      </a>
    }
  </app-data-table>
</app-page>
