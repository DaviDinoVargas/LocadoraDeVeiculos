<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar plano de cobrança' : 'Novo plano de cobrança'"
      descricao="Define a diária e o preço por quilômetro cobrados dos veículos de um grupo."
      voltarPara="/planos-cobranca"
      rotuloVoltar="Planos de cobrança"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Plano" descricao="A que grupo de veículos o plano se aplica.">
        <app-form-field class="col-span-12 sm:col-span-6" label="Nome do plano" required>
          <input hlmInput formControlName="nome" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Grupo de veículo" required>
          <hlm-native-select class="w-full" formControlName="grupoAutomovelId">
            <option hlmNativeSelectOption value="">Selecione um grupo</option>
            @for (grupo of grupos(); track grupo.id) {
              <option hlmNativeSelectOption [value]="grupo.id">{{ grupo.nome }}</option>
            }
          </hlm-native-select>
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Preços" descricao="O valor do aluguel é calculado no servidor com estes preços.">
        <app-form-field class="col-span-12 sm:col-span-4" label="Preço da diária" required [mensagens]="mensagensPreco">
          <app-input-prefixo>
            <input hlmInput type="number" formControlName="precoDiaria" step="0.01" min="0" inputmode="decimal" />
          </app-input-prefixo>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Preço por km" [mensagens]="mensagensPreco" hint="Cobrado acima do limite de km livre.">
          <app-input-prefixo>
            <input hlmInput type="number" formControlName="precoPorKm" step="0.01" min="0" inputmode="decimal" />
          </app-input-prefixo>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Km livre (limite)" [mensagens]="mensagensPreco" hint="Quilômetros sem cobrança extra.">
          <input hlmInput type="number" formControlName="kmLivreLimite" step="1" min="0" inputmode="numeric" />
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar plano'" (cancelar)="cancelar()" />
  </app-page>
</form>
