<app-page>
  <app-page-header titulo="Planos de cobrança" descricao="Diária e preço por quilômetro de cada grupo de veículos.">
    <a acoes hlmBtn routerLink="/planos-cobranca/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo plano
    </a>
  </app-page-header>

  <app-data-table
    tableId="planos-cobranca"
    itens="planos de cobrança"
    item="plano"
    [colunas]="colunas"
    [dados]="planos()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum plano de cobrança ainda"
    descricaoVazio="Sem um plano, os veículos do grupo não têm preço e não podem ser alugados."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/planos-cobranca/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo plano
    </a>
  </app-data-table>
</app-page>
