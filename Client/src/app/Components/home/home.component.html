<div class="home-container">
  <div class="home-header">
    <h1>Locadora de Veículos</h1>
    <p class="subtitulo" *ngIf="nomeUsuario">Bem-vindo(a) de volta, {{ nomeUsuario }}.</p>
  </div>

  <div class="cards-grid">
    <a class="atalho-card" *ngFor="let atalho of atalhos" [routerLink]="atalho.rota">
      <div class="atalho-icone">
        <i class="bi" [ngClass]="atalho.icone"></i>
      </div>
      <div class="atalho-texto">
        <h2>{{ atalho.titulo }}</h2>
        <p>{{ atalho.descricao }}</p>
      </div>
      <i class="bi bi-arrow-right atalho-seta"></i>
    </a>
  </div>
</div>
