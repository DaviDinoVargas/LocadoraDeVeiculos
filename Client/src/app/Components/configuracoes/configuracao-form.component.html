<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="estreita">
    <app-page-header titulo="Preço do combustível e caução" descricao="Parâmetros gerais usados no cálculo dos aluguéis e das devoluções." />

    <app-form-errors [erros]="erros()" />

    @if (mensagemSucesso()) {
      <div hlmAlert role="status">
        <ng-icon name="lucideCircleCheck" aria-hidden="true" />
        <p hlmAlertDescription>{{ mensagemSucesso() }}</p>
      </div>
    }

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Valores" descricao="A caução vale para os novos aluguéis; alterar o valor não muda a caução de aluguéis já contratados.">
        <app-form-field class="col-span-12 sm:col-span-6" label="Preço do combustível (por litro)" required [mensagens]="mensagensCombustivel">
          <app-input-prefixo>
            <input hlmInput type="number" formControlName="precoCombustivel" step="0.01" min="0" inputmode="decimal" />
          </app-input-prefixo>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Caução (garantia)" required [mensagens]="mensagensGarantia">
          <app-input-prefixo>
            <input hlmInput type="number" formControlName="valorGarantia" step="0.01" min="0" max="100000" inputmode="decimal" />
          </app-input-prefixo>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" rotuloSalvar="Salvar configurações" (cancelar)="cancelar()" />
  </app-page>
</form>
