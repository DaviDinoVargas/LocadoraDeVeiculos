<app-page>
  <app-page-header titulo="Cupons" descricao="Cupons de desconto que podem ser aplicados no aluguel.">
    <a acoes hlmBtn routerLink="/cupons/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo cupom
    </a>
  </app-page-header>

  <app-data-table
    tableId="cupons"
    itens="cupons"
    item="cupom"
    [colunas]="colunas"
    [dados]="cupons()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum cupom cadastrado"
    descricaoVazio="Crie cupons para dar desconto no valor do aluguel."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/cupons/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo cupom
    </a>
  </app-data-table>
</app-page>
