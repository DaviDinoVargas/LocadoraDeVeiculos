<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar cupom' : 'Novo cupom'"
      descricao="Código de desconto que o cliente informa ao alugar."
      voltarPara="/cupons"
      rotuloVoltar="Cupons"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Identificação">
        <app-form-field class="col-span-12 sm:col-span-4" label="Código" required>
          <input hlmInput formControlName="codigo" class="uppercase" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-8" label="Descrição" required>
          <input hlmInput formControlName="descricao" autocomplete="off" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Desconto e validade">
        <app-form-field class="col-span-12 sm:col-span-4" label="Tipo de desconto" required>
          <hlm-native-select class="w-full" formControlName="tipoDesconto">
            <option hlmNativeSelectOption value="">Selecione o tipo</option>
            @for (t of tiposDesconto; track t.value) {
              <option hlmNativeSelectOption [value]="t.value">{{ t.label }}</option>
            }
          </hlm-native-select>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Valor do desconto" required [mensagens]="mensagensValor">
          <input hlmInput type="number" formControlName="valorDesconto" step="0.01" min="0" inputmode="decimal" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Válido até" required>
          <input hlmInput type="date" formControlName="validoAte" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Limite de usos" required [mensagens]="mensagensLimite">
          <input hlmInput type="number" formControlName="limiteUsos" min="1" inputmode="numeric" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Parceiro" descricao="Opcional: o cupom pode ser oferecido por um parceiro.">
        <app-form-field class="col-span-12 sm:col-span-6" label="Parceiro">
          <hlm-native-select class="w-full" formControlName="parceiroId">
            <option hlmNativeSelectOption value="">Nenhum parceiro</option>
            @for (p of parceiros(); track p.id) {
              <option hlmNativeSelectOption [value]="p.id">{{ p.nome }}</option>
            }
          </hlm-native-select>
        </app-form-field>
        @if (editMode()) {
          <div class="col-span-12 flex items-center gap-3">
            <hlm-checkbox inputId="cupom-ativo" formControlName="ativo" />
            <label hlmLabel for="cupom-ativo">Cupom ativo</label>
          </div>
        }
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar cupom'" (cancelar)="cancelar()" />
  </app-page>
</form>
