<app-page>
  <app-page-header titulo="Aluguéis" descricao="Reservas, locações em andamento e histórico.">
    <button acoes hlmBtn variant="outline" type="button" [disabled]="carregando() || alugueisFiltrados().length === 0" (click)="exportarPdf()">
      <ng-icon name="lucideFileText" aria-hidden="true" />
      Exportar PDF
    </button>
    <a acoes hlmBtn routerLink="/alugueis/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo aluguel
    </a>
  </app-page-header>

  <!-- Filtro por status (consulta o servidor) -->
  <div class="-mb-2 flex flex-wrap gap-2" role="group" aria-label="Filtrar por status">
    @for (aba of abas; track aba.status) {
      <button
        type="button"
        class="text-label-l min-h-9 rounded-full border px-4 transition-colors"
        [class]="filtroStatus() === aba.status ? 'border-transparent bg-secondary text-secondary-foreground' : 'border-border text-muted-foreground hover:bg-accent/40'"
        [attr.aria-pressed]="filtroStatus() === aba.status"
        (click)="filtrarPorStatus(aba.status)"
      >
        {{ aba.rotulo }}
      </button>
    }
  </div>

  <app-data-table
    tableId="alugueis"
    itens="aluguéis"
    item="aluguel"
    [colunas]="colunas"
    [dados]="alugueisFiltrados()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes()"
    [tituloLinha]="tituloLinha"
    [ordenacaoPadrao]="{ id: 'dataSaida', desc: true }"
    [tituloVazio]="filtroStatus() === 'todos' ? 'Nenhum aluguel registrado' : 'Nenhum aluguel neste status'"
    [descricaoVazio]="filtroStatus() === 'todos' ? 'Registre o primeiro aluguel para acompanhar reservas e devoluções.' : 'Escolha outro status acima ou registre um novo aluguel.'"
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/alugueis/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo aluguel
    </a>
  </app-data-table>
</app-page>
