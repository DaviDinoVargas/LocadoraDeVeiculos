<app-page>
  <app-page-header titulo="Veículos" descricao="Frota cadastrada, com grupo, combustível e foto.">
    @if (podeEditar()) {
      <a acoes hlmBtn routerLink="/veiculos/new">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Novo veículo
      </a>
    }
  </app-page-header>

  <app-data-table
    tableId="veiculos"
    itens="veículos"
    item="veículo"
    [colunas]="colunas"
    [dados]="veiculos()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes()"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum veículo cadastrado"
    [descricaoVazio]="podeEditar() ? 'Cadastre o primeiro veículo para começar a montar a frota.' : 'Peça a um administrador para cadastrar os veículos da frota.'"
    (recarregar)="carregar()"
  >
    @if (podeEditar()) {
      <label filtros class="flex items-center gap-2">
        <span class="text-label-l text-muted-foreground">Grupo</span>
        <hlm-native-select size="sm" aria-label="Filtrar por grupo" (valueChange)="filtrarPorGrupo($event ?? '')">
          <option hlmNativeSelectOption value="">Todos os grupos</option>
          @for (grupo of grupos(); track grupo.id) {
            <option hlmNativeSelectOption [value]="grupo.id">{{ grupo.nome }}</option>
          }
        </hlm-native-select>
      </label>
      <a acaoVazia hlmBtn routerLink="/veiculos/new">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Novo veículo
      </a>
    }

    <ng-template appCelula="foto" let-veiculo>
      @if (fotoVisivel(veiculo)) {
        <img
          [src]="veiculo.foto"
          [alt]="'Foto de ' + tituloLinha(veiculo)"
          loading="lazy"
          class="bg-muted h-10 w-16 rounded-lg object-cover"
          (error)="fotoQuebrou(veiculo)"
        />
      } @else {
        <span class="bg-muted text-muted-foreground flex h-10 w-16 items-center justify-center rounded-lg" role="img" aria-label="Sem foto">
          <ng-icon name="lucideCar" class="text-xl" aria-hidden="true" />
        </span>
      }
    </ng-template>
  </app-data-table>
</app-page>
