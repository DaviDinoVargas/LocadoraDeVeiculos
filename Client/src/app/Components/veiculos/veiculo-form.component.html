<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar veículo' : 'Novo veículo'"
      descricao="Dados do veículo da frota. A placa deve estar no formato AAA-0000 ou AAA-0A00."
      voltarPara="/veiculos"
      rotuloVoltar="Veículos"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Identificação" descricao="Como o veículo é reconhecido na locadora.">
        <app-form-field class="col-span-12 sm:col-span-4" label="Placa" required [mensagens]="mensagensPlaca">
          <input hlmInput formControlName="placa" appMascara="placa" placeholder="AAA-0A00" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Marca" required>
          <input hlmInput formControlName="marca" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Modelo" required>
          <input hlmInput formControlName="modelo" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Cor" required>
          <input hlmInput formControlName="cor" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Ano" required [mensagens]="mensagensAno">
          <input hlmInput type="number" formControlName="ano" min="1900" [max]="anoAtual + 1" inputmode="numeric" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="Grupo de veículo" required>
          <hlm-native-select class="w-full" formControlName="grupoAutomovelId">
            <option hlmNativeSelectOption value="">Selecione um grupo</option>
            @for (grupo of grupos(); track grupo.id) {
              <option hlmNativeSelectOption [value]="grupo.id">{{ grupo.nome }}</option>
            }
          </hlm-native-select>
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Combustível" descricao="Usado no cálculo de abastecimento na devolução.">
        <app-form-field class="col-span-12 sm:col-span-6" label="Tipo de combustível" required>
          <hlm-native-select class="w-full" formControlName="tipoCombustivel">
            <option hlmNativeSelectOption value="">Selecione o tipo de combustível</option>
            @for (tipo of combustiveis; track tipo) {
              <option hlmNativeSelectOption [value]="tipo">{{ tipo }}</option>
            }
          </hlm-native-select>
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Capacidade do tanque (litros)" required [mensagens]="{ min: 'A capacidade deve ser maior que 0.' }">
          <input hlmInput type="number" formControlName="capacidadeTanque" step="0.1" min="0" inputmode="decimal" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Foto" descricao="Opcional. Aparece na lista de veículos.">
        <app-form-field class="col-span-12" label="Endereço (URL) da imagem" hint="Cole o link de uma imagem do veículo.">
          <input hlmInput type="url" formControlName="foto" placeholder="https://..." autocomplete="off" />
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar veículo'" (cancelar)="cancelar()" />
  </app-page>
</form>
