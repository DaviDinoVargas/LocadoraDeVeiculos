<app-page>
  <app-page-header titulo="Devoluções" descricao="Veículos devolvidos, com multas, combustível e valor final de cada aluguel.">
    <button acoes hlmBtn variant="outline" type="button" [disabled]="carregando() || devolucoes().length === 0" (click)="exportarPdf()">
      <ng-icon name="lucideFileText" aria-hidden="true" />
      Exportar PDF
    </button>
  </app-page-header>

  <app-data-table
    tableId="devolucoes"
    itens="devoluções"
    item="devolução"
    [colunas]="colunas"
    [dados]="devolucoes()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    linhasClicaveis
    [ordenacaoPadrao]="{ id: 'dataDevolucao', desc: true }"
    tituloVazio="Nenhuma devolução registrada"
    descricaoVazio="As devoluções aparecem aqui depois que um aluguel em andamento é devolvido."
    (linhaClique)="visualizar($event.id)"
    (recarregar)="carregar()"
  />
</app-page>
