<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar condutor' : 'Novo condutor'"
      descricao="Pessoa habilitada a dirigir os veículos alugados por um cliente."
      voltarPara="/condutores"
      rotuloVoltar="Condutores"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados pessoais">
        <app-form-field class="col-span-12 sm:col-span-8" label="Nome completo" required>
          <input hlmInput formControlName="nome" autocomplete="name" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="CPF" required [mensagens]="mensagensCpf">
          <input hlmInput formControlName="cpf" appMascara="cpf" placeholder="000.000.000-00" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Telefone" required>
          <input hlmInput type="tel" formControlName="telefone" appMascara="telefone" placeholder="(00) 00000-0000" autocomplete="tel" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="E-mail">
          <input hlmInput type="email" formControlName="email" autocomplete="email" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Habilitação">
        <app-form-field class="col-span-12 sm:col-span-6" label="Número da CNH" required>
          <input hlmInput formControlName="cnh" inputmode="numeric" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Validade da CNH" required>
          <input hlmInput type="date" formControlName="validadeCnh" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Cliente" descricao="O cliente que responde pelo condutor nos aluguéis.">
        <app-form-field class="col-span-12 sm:col-span-6" label="Cliente" required>
          <hlm-native-select class="w-full" formControlName="clienteId">
            <option hlmNativeSelectOption value="">Selecione um cliente</option>
            @for (cliente of clientes(); track cliente.id) {
              <option hlmNativeSelectOption [value]="cliente.id">{{ cliente.nome }}</option>
            }
          </hlm-native-select>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar condutor'" (cancelar)="cancelar()" />
  </app-page>
</form>
