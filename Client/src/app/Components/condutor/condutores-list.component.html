<app-page>
  <app-page-header titulo="Condutores" descricao="Pessoas habilitadas a dirigir os veículos alugados por cada cliente.">
    <a acoes hlmBtn routerLink="/condutores/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo condutor
    </a>
  </app-page-header>

  <app-data-table
    tableId="condutores"
    itens="condutores"
    item="condutor"
    [colunas]="colunas"
    [dados]="condutoresFiltrados()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum condutor cadastrado"
    descricaoVazio="Cadastre os condutores para poder registrar aluguéis em nome do cliente."
    (recarregar)="carregar()"
  >
    <label filtros class="flex items-center gap-2">
      <span class="text-label-l text-muted-foreground">Cliente</span>
      <hlm-native-select size="sm" aria-label="Filtrar por cliente" (valueChange)="filtrarPorCliente($event ?? '')">
        <option hlmNativeSelectOption value="">Todos os clientes</option>
        @for (cliente of clientes(); track cliente.id) {
          <option hlmNativeSelectOption [value]="cliente.id">{{ cliente.nome }}</option>
        }
      </hlm-native-select>
    </label>
    <a acaoVazia hlmBtn routerLink="/condutores/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo condutor
    </a>
  </app-data-table>
</app-page>
