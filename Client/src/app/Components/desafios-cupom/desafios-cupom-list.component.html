<app-page>
  <app-page-header titulo="Desafios de cupom" descricao="Metas de aluguéis que liberam um cupom de recompensa para o cliente.">
    <a acoes hlmBtn routerLink="/desafios-cupom/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo desafio
    </a>
  </app-page-header>

  <app-data-table
    tableId="desafios-cupom"
    itens="desafios"
    item="desafio"
    [colunas]="colunas"
    [dados]="desafios()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum desafio cadastrado"
    descricaoVazio="Crie um desafio para premiar clientes frequentes com cupons."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/desafios-cupom/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo desafio
    </a>
  </app-data-table>
</app-page>
