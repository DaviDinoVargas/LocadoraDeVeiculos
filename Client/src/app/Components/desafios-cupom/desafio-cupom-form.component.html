<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar desafio de cupom' : 'Novo desafio de cupom'"
      descricao="Quando o cliente cumpre a meta no período, o cupom de recompensa é liberado para ele."
      voltarPara="/desafios-cupom"
      rotuloVoltar="Desafios de cupom"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Desafio">
        <app-form-field class="col-span-12 sm:col-span-5" label="Nome" required>
          <input hlmInput formControlName="nome" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-7" label="Descrição" required>
          <input hlmInput formControlName="descricao" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Meta de aluguéis" required [mensagens]="mensagensMeta">
          <input hlmInput type="number" formControlName="metaQuantidadeAlugueis" min="1" inputmode="numeric" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Período (dias)" required [mensagens]="mensagensPeriodo">
          <input hlmInput type="number" formControlName="periodoDias" min="1" inputmode="numeric" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Recompensa">
        <app-form-field class="col-span-12 sm:col-span-8" label="Cupom de recompensa" required [mensagens]="mensagensCupom">
          <hlm-native-select class="w-full" formControlName="cupomRecompensaId">
            <option hlmNativeSelectOption value="">Selecione o cupom</option>
            @for (c of cupons(); track c.id) {
              <option hlmNativeSelectOption [value]="c.id">{{ c.codigo }} — {{ c.descricao }}</option>
            }
          </hlm-native-select>
        </app-form-field>
        @if (editMode()) {
          <div class="col-span-12 flex items-center gap-3">
            <hlm-checkbox inputId="desafio-ativo" formControlName="ativo" />
            <label hlmLabel for="desafio-ativo">Desafio ativo</label>
          </div>
        }
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar desafio'" (cancelar)="cancelar()" />
  </app-page>
</form>
