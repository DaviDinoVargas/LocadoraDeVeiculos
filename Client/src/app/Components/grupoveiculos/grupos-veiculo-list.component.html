<app-page>
  <app-page-header titulo="Grupos de veículo" descricao="Categorias da frota (econômico, SUV, pickup...). Cada grupo tem seus planos de cobrança.">
    <a acoes hlmBtn routerLink="/grupoveiculos/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo grupo
    </a>
  </app-page-header>

  <app-data-table
    tableId="grupos-veiculo"
    itens="grupos de veículo"
    item="grupo"
    [colunas]="colunas"
    [dados]="grupos()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum grupo de veículo ainda"
    descricaoVazio="Crie o primeiro grupo para organizar a frota e definir planos de cobrança."
    (recarregar)="carregar()"
  >
    <a acaoVazia hlmBtn routerLink="/grupoveiculos/new">
      <ng-icon name="lucidePlus" aria-hidden="true" />
      Novo grupo
    </a>
  </app-data-table>
</app-page>
