<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="estreita">
    <app-page-header
      [titulo]="editMode() ? 'Editar grupo de veículo' : 'Novo grupo de veículo'"
      descricao="Agrupa veículos parecidos e serve de base para os planos de cobrança."
      voltarPara="/grupoveiculos"
      rotuloVoltar="Grupos de veículo"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados do grupo">
        <app-form-field class="col-span-12" label="Nome do grupo" required>
          <input hlmInput formControlName="nome" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12" label="Descrição" hint="Opcional. Aparece na lista de grupos.">
          <textarea hlmTextarea formControlName="descricao" rows="3"></textarea>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar grupo'" (cancelar)="cancelar()" />
  </app-page>
</form>
