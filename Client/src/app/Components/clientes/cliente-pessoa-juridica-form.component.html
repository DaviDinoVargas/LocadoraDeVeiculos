<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar pessoa jurídica' : 'Nova pessoa jurídica'"
      descricao="Empresa cliente, com razão social e CNPJ."
      voltarPara="/clientes/pj"
      rotuloVoltar="Pessoas jurídicas"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Empresa">
        <app-form-field class="col-span-12 sm:col-span-6" label="Razão social" required [mensagens]="{ required: 'A razão social é obrigatória.' }">
          <input hlmInput formControlName="nome" autocomplete="organization" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Nome fantasia">
          <input hlmInput formControlName="nomeFantasia" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="CNPJ" required [mensagens]="mensagensCnpj">
          <input hlmInput formControlName="cnpj" appMascara="cnpj" placeholder="00.000.000/0000-00" autocomplete="off" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Contato">
        <app-form-field class="col-span-12 sm:col-span-6" label="Telefone" required>
          <input hlmInput type="tel" formControlName="telefone" appMascara="telefone" placeholder="(00) 00000-0000" autocomplete="tel" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="E-mail">
          <input hlmInput type="email" formControlName="email" autocomplete="email" />
        </app-form-field>
        <app-form-field class="col-span-12" label="Endereço">
          <textarea hlmTextarea formControlName="endereco" rows="3"></textarea>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar cliente'" (cancelar)="cancelar()" />
  </app-page>
</form>
