<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <app-page largura="form">
    <app-page-header
      [titulo]="editMode() ? 'Editar pessoa física' : 'Nova pessoa física'"
      descricao="Cliente pessoa física, com documento e habilitação."
      voltarPara="/clientes/pf"
      rotuloVoltar="Pessoas físicas"
    />

    <app-form-errors [erros]="erros()" />

    @if (carregando()) {
      <app-form-skeleton />
    } @else {
      <app-form-section titulo="Dados pessoais">
        <app-form-field class="col-span-12 sm:col-span-8" label="Nome completo" required>
          <input hlmInput formControlName="nome" placeholder="Digite o nome completo" autocomplete="name" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="CPF" required [mensagens]="mensagensCpf">
          <input hlmInput formControlName="cpf" appMascara="cpf" placeholder="000.000.000-00" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-4" label="RG" hint="Formato 00.000.000-0">
          <input hlmInput formControlName="rg" placeholder="00.000.000-0" maxlength="12" autocomplete="off" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Habilitação" descricao="Necessária para alugar em nome próprio.">
        <app-form-field class="col-span-12 sm:col-span-6" label="CNH">
          <input hlmInput formControlName="cnh" placeholder="Número da CNH" inputmode="numeric" autocomplete="off" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="Validade da CNH">
          <input hlmInput type="date" formControlName="validadeCnh" />
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Contato">
        <app-form-field class="col-span-12 sm:col-span-6" label="Telefone" required>
          <input hlmInput type="tel" formControlName="telefone" appMascara="telefone" placeholder="(00) 00000-0000" autocomplete="tel" />
        </app-form-field>
        <app-form-field class="col-span-12 sm:col-span-6" label="E-mail">
          <input hlmInput type="email" formControlName="email" placeholder="email@exemplo.com" autocomplete="email" />
        </app-form-field>
        <app-form-field class="col-span-12" label="Endereço">
          <textarea hlmTextarea formControlName="endereco" rows="3" placeholder="Rua, número, bairro, cidade, estado"></textarea>
        </app-form-field>
      </app-form-section>

      <app-form-section titulo="Vínculo" descricao="Opcional: vincule esta pessoa a uma empresa cliente.">
        <app-form-field class="col-span-12 sm:col-span-8" label="Pessoa jurídica">
          <hlm-native-select class="w-full" formControlName="clientePessoaJuridicaId">
            <option hlmNativeSelectOption value="">Nenhuma</option>
            @for (pj of pessoasJuridicas(); track pj.id) {
              <option hlmNativeSelectOption [value]="pj.id">{{ pj.nome }} ({{ formatarCNPJ(pj.cnpj) }})</option>
            }
          </hlm-native-select>
        </app-form-field>
      </app-form-section>
    }

    <app-form-actions [salvando]="salvando()" [alterado]="form.dirty" [rotuloSalvar]="editMode() ? 'Salvar alterações' : 'Criar cliente'" (cancelar)="cancelar()" />
  </app-page>
</form>
