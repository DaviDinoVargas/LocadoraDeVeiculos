<app-page>
  <app-page-header [titulo]="titulo" descricao="Pessoas físicas e jurídicas que alugam veículos.">
    @if (modoLista === 'todos') {
      <button acoes hlmBtn type="button" [hlmDropdownMenuTrigger]="menuNovo" align="end" aria-haspopup="menu">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Novo cliente
        <ng-icon name="lucideChevronDown" aria-hidden="true" />
      </button>
    } @else if (modoLista === 'pf') {
      <a acoes hlmBtn routerLink="/clientes/new/pf">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Nova pessoa física
      </a>
    } @else {
      <a acoes hlmBtn routerLink="/clientes/new/pj">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Nova pessoa jurídica
      </a>
    }
  </app-page-header>

  <!-- Abas por tipo de cliente (cada uma é uma rota) -->
  <nav aria-label="Tipo de cliente" class="border-border -mb-2 flex gap-1 border-b">
    <a
      routerLink="/clientes"
      routerLinkActive="border-primary text-foreground"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-label-l text-muted-foreground hover:text-foreground -mb-px inline-flex min-h-11 items-center border-b-2 border-transparent px-4"
      ariaCurrentWhenActive="page"
    >
      Todos
    </a>
    <a
      routerLink="/clientes/pf"
      routerLinkActive="border-primary text-foreground"
      class="text-label-l text-muted-foreground hover:text-foreground -mb-px inline-flex min-h-11 items-center border-b-2 border-transparent px-4"
      ariaCurrentWhenActive="page"
    >
      Pessoas físicas
    </a>
    <a
      routerLink="/clientes/pj"
      routerLinkActive="border-primary text-foreground"
      class="text-label-l text-muted-foreground hover:text-foreground -mb-px inline-flex min-h-11 items-center border-b-2 border-transparent px-4"
      ariaCurrentWhenActive="page"
    >
      Pessoas jurídicas
    </a>
  </nav>

  <app-data-table
    [tableId]="'clientes-' + modoLista"
    itens="clientes"
    item="cliente"
    [colunas]="colunas()"
    [dados]="clientes()"
    [carregando]="carregando()"
    [erro]="erro()"
    [acoesLinha]="acoes"
    [tituloLinha]="tituloLinha"
    tituloVazio="Nenhum cliente cadastrado"
    descricaoVazio="Cadastre o primeiro cliente para poder registrar aluguéis."
    (recarregar)="carregar()"
  >
    @if (modoLista === 'todos') {
      <button acaoVazia hlmBtn type="button" [hlmDropdownMenuTrigger]="menuNovo" align="center" aria-haspopup="menu">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Novo cliente
      </button>
    } @else {
      <button acaoVazia hlmBtn type="button" (click)="novo()">
        <ng-icon name="lucidePlus" aria-hidden="true" />
        Novo cliente
      </button>
    }
  </app-data-table>
</app-page>

<ng-template #menuNovo>
  <hlm-dropdown-menu class="w-48">
    <button hlmDropdownMenuItem type="button" (triggered)="novoCliente('pf')">
      <ng-icon name="lucideUser" aria-hidden="true" />
      Pessoa física
    </button>
    <button hlmDropdownMenuItem type="button" (triggered)="novoCliente('pj')">
      <ng-icon name="lucideBuilding2" aria-hidden="true" />
      Pessoa jurídica
    </button>
  </hlm-dropdown-menu>
</ng-template>
