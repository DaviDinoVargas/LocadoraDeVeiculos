<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Locadora de Veículos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script>
    // Aplica o tema salvo (ou o do sistema) antes da primeira pintura, para não piscar claro/escuro.
    (function () {
      try {
        var salvo = localStorage.getItem('tema');
        var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (escuro) document.documentElement.classList.add('dark');
      } catch (e) { /* armazenamento indisponível: segue o tema claro */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
